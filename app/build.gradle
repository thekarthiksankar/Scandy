// @TODO Add Firebase Analytics

plugins {
    alias(libs.plugins.android.application)
}
android {
    compileSdk 37

    defaultConfig {
        applicationId "dev.thedukerchip.scandy"
        minSdk 23
        targetSdk 37
        versionCode 7
        versionName "1.0.3"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        ndk {
            debugSymbolLevel = "FULL"
        }
    }

    buildTypes {
        release {
            optimization {
                enable = true
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }

        debug {
            minifyEnabled false
            applicationIdSuffix '.dev'
            versionNameSuffix '-Dev'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
    }

    sourceSets {
        main {
            res.srcDirs = [
                    "src/main/res/common",
                    "src/main/res/launcher",
                    "src/main/res/scanner"
            ]
        }
    }
    namespace 'scandy'
}

dependencies {
    implementation libs.bundles.kotlinx.coroutines
    implementation libs.androidx.coreKtx
    implementation libs.androidx.core.splashscreen
    implementation libs.androidx.appcompat
    implementation libs.material
    implementation libs.androidx.constraintlayout

    implementation libs.mlkit.barcodeScanning

    implementation libs.bundles.androidx.camera
    implementation libs.bundles.androidx.lifecycle

    testImplementation libs.junit
    androidTestImplementation libs.androidxTest.junitExt
    androidTestImplementation libs.androidxTest.espresso
}