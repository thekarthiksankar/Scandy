[versions]
agp = "9.3.1"
androidxCamera = "1.6.1"
androidxLifecycle = "2.11.0"
# Must match the Kotlin that AGP bundles; re-check on AGP bumps.
kotlin = "2.2.20"
kotlinxCoroutines = "1.11.0"

[libraries]
androidx-activity-compose = "androidx.activity:activity-compose:1.13.0"
androidx-appcompat = "androidx.appcompat:appcompat:1.7.1"
androidx-camera-compose = { module = "androidx.camera:camera-compose", version.ref = "androidxCamera" }
androidx-camera-core = { module = "androidx.camera:camera-camera2", version.ref = "androidxCamera" }
androidx-camera-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "androidxCamera" }
androidx-camera-view = { module = "androidx.camera:camera-view", version.ref = "androidxCamera" }
androidx-compose-bom = "androidx.compose:compose-bom:2026.06.01"
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-coreKtx = "androidx.core:core-ktx:1.19.0"
androidx-core-splashscreen = "androidx.core:core-splashscreen:1.2.0"
androidx-constraintlayout = "androidx.constraintlayout:constraintlayout:2.2.2"
androidx-lifecycle-runtime = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "androidxLifecycle" }
androidx-lifecycle-livedata = { module = "androidx.lifecycle:lifecycle-livedata-ktx", version.ref = "androidxLifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidxLifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidxLifecycle" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-play-services = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-play-services", version.ref = "kotlinxCoroutines" }
material = "com.google.android.material:material:1.14.0"
mlkit-barcodeScanning = "com.google.mlkit:barcode-scanning:17.3.0"

# Testing Dependencies
androidxTest-espresso = "androidx.test.espresso:espresso-core:3.7.0"
androidxTest-junitExt = "androidx.test.ext:junit:1.3.0"
junit = "junit:junit:4.13.2"

[bundles]
androidx-camera = ["androidx-camera-compose", "androidx-camera-core", "androidx-camera-lifecycle", "androidx-camera-view"]
androidx-compose = [
    "androidx-compose-material3",
    "androidx-compose-ui",
    "androidx-compose-ui-graphics",
    "androidx-compose-ui-tooling-preview",
]
androidx-lifecycle = ["androidx-lifecycle-runtime", "androidx-lifecycle-livedata"]
androidx-lifecycle-compose = ["androidx-lifecycle-runtime-compose", "androidx-lifecycle-viewmodel-compose"]
kotlinx-coroutines = ["kotlinx-coroutines-android", "kotlinx-coroutines-play-services"]

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
